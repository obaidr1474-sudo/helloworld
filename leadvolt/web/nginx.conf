server {
  listen 8080;
  root /usr/share/nginx/html;
  server_tokens off;
  client_max_body_size 1m;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy same-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' ws://$http_host wss://$http_host; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
  add_header Cache-Control "no-cache" always;
  location /api/ { proxy_pass http://server:4000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_read_timeout 30s; }
  location /s/ { proxy_pass http://server:4000; }
  location /ws { proxy_pass http://server:4000; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_read_timeout 75s; }
  location /assets/ { expires 1y; try_files $uri =404; }
  location / { try_files $uri /index.html; }
}
