services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: leadvolt
      POSTGRES_USER: leadvolt
      POSTGRES_PASSWORD: leadvolt
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadvolt -d leadvolt"]
      interval: 3s
      retries: 20

  server:
    build: { context: ., dockerfile: server/Dockerfile }
    environment:
      DATABASE_URL: postgres://leadvolt_app:leadvolt_app@db:5432/leadvolt
      MIGRATION_DATABASE_URL: postgres://leadvolt:leadvolt@db:5432/leadvolt
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-change-me}
      CORS_ORIGIN: http://localhost:8080
      PUBLIC_BASE_URL: http://localhost:8080
    depends_on:
      db: { condition: service_healthy }
    ports: ["4000:4000"]

  web:
    build: { context: ., dockerfile: web/Dockerfile }
    depends_on: [server]
    ports: ["8080:80"]

volumes:
  pgdata:
