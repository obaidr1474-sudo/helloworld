name: LeadVolt verification
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_DB: leadvolt_test, POSTGRES_USER: leadvolt, POSTGRES_PASSWORD: leadvolt}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U leadvolt" --health-interval 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm, cache-dependency-path: package-lock.json}
      - run: npm ci
      - run: |
          PGPASSWORD=leadvolt psql -h localhost -U leadvolt -d leadvolt_test -v ON_ERROR_STOP=1 -c "CREATE ROLE leadvolt_app LOGIN PASSWORD 'leadvolt_app'; CREATE ROLE leadvolt_worker LOGIN PASSWORD 'leadvolt_worker'"
      - run: npm run build
      - run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgres://leadvolt_app:leadvolt_app@localhost:5432/leadvolt_test
          TEST_MIGRATION_URL: postgres://leadvolt:leadvolt@localhost:5432/leadvolt_test
          TEST_WORKER_DATABASE_URL: postgres://leadvolt_worker:leadvolt_worker@localhost:5432/leadvolt_test
      - run: npm audit --audit-level=moderate
      - name: Install browser test dependencies
        run: |
          python -m pip install -r scripts/requirements-browser.txt
          python -m playwright install --with-deps chromium
      - name: Run browser workflows
        env:
          DATABASE_URL: postgres://leadvolt_app:leadvolt_app@localhost:5432/leadvolt_test
          WORKER_DATABASE_URL: postgres://leadvolt_worker:leadvolt_worker@localhost:5432/leadvolt_test
          CORS_ORIGIN: http://localhost:5173
          PUBLIC_BASE_URL: http://localhost:5173
        run: |
          npm run dev -w server > /tmp/leadvolt-api.log 2>&1 &
          npm run dev -w web -- --host 127.0.0.1 > /tmp/leadvolt-web.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:5173/api/v1/me -o /dev/null || [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5173/api/v1/me)" = 401 ]; then break; fi
            sleep 1
          done
          python scripts/browser_smoke.py
          python scripts/browser_routing.py
